version: '3.8'

services:
  bullmq:
    build:
      context: .
    container_name: bullmq
    networks:
      - app-network
    ports:
      - "3001:3001"
    environment:
      - ./apps/next-app/.env.production
    command: >
      sh -c "yarn bullmq"
    restart: always

volumes:
  www-html:

networks:
  app-network:
    driver: bridge
