version: '3.8'

services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-network
    restart: always

  worker:
    build:
      context: .
    container_name: worker
    command: ["yarn", "worker"]
    depends_on:
      - redis
    networks:
      - app-network
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    restart: always

  web:
    build:
      context: .
    container_name: web
    command: ["yarn", "dev"]
    depends_on:
      - redis
    networks:
      - app-network
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:3000
    restart: always

networks:
  app-network:
    driver: bridge
