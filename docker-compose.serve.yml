services:
  nextjs:
    image: node:20-alpine3.19
    container_name: next.js-serve
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - '3008:3008'
    environment:
      - NODE_ENV=production
    env_file:
      - ./apps/next-app/.env.production
    command: >
      sh -c "yarn serve"
    networks:
      - app-network

volumes:
  www-html:

networks:
  app-network:
    driver: bridge
