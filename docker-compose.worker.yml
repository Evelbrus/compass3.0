services:
  worker:
    build:
      context: .
    container_name: worker
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=production
    command: >
      sh -c "yarn worker"
    networks:
      - app-network
    restart: always

volumes:
  www-html:

networks:
  app-network:
    driver: bridge
