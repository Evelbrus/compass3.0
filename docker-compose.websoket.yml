services:
  websocket-server:
    image: node:20-alpine3.19
    container_name: websocket
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=production
    env_file:
      - ./apps/next-app/.env.production
    command: >
      sh -c "yarn webS"
    networks:
      - app-network

volumes:
  www-html:

networks:
  app-network:
    driver: bridge
