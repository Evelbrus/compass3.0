services:
  websocket-server:
    image: node:20-alpine3.19
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
    command: >
      sh -c "yarn webS"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
