version: '3.8'

services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6380:6379"
    networks:
      - app-network
    env_file:
      - ./apps/next-app/.env.production
    restart: always

  worker:
    build:
      context: .
    container_name: worker
    depends_on:
      - redis
    env_file:
      - ./apps/next-app/.env.production
    command: ["yarn", "worker"]
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge
